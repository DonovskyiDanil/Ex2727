# version: '3'
services:

  front-react:
    build:
      context: ./client

    environment:
      NODE_ENV: development
    depends_on:
      - server-dev
    volumes:
      - ./client:/client
      - /client/node_modules
    ports:
      - "3000:3000"
      
  server-dev:
    build:
      context: ./server
    environment:
      NODE_ENV: development
    ports:
      - "5001:5001"
    depends_on:
      - db-dev
      - mongo-dev
    volumes:
      - ./server:/server


  mongo-dev:
    image: mongo:7
    ports:
      - "12345:27017"
    volumes:
      - mongo_data:/data/db

  db-dev:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=todo-dev
    ports:
      - "12346:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data:
